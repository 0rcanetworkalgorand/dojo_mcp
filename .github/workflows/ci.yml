name: MCP Server CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate server syntax
        run: python3 -c "import ast; ast.parse(open('server.py').read()); print('✅ server.py syntax OK')"

      - name: Verify server imports
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, '.')
          # Verify the module can be imported without errors
          import importlib.util
          spec = importlib.util.spec_from_file_location('server', 'server.py')
          mod = importlib.util.module_from_spec(spec)
          # Don't actually execute (would start the server), just verify syntax + imports
          print('✅ server.py imports resolve')
          "

      - name: Check README exists
        run: |
          ls README.md
          echo "✅ Documentation present"
