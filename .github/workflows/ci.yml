name: MCP Server CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate server syntax
        run: python -c "import ast; ast.parse(open('server.py').read()); print('✅ server.py syntax OK')"

      - name: Verify MCP tools load
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from server import mcp
          tools = mcp._tool_manager._tools
          expected = ['list_agents', 'get_agent', 'match_agent', 'create_task', 'get_task_status', 'list_tasks']
          for name in expected:
              assert name in tools, f'Missing tool: {name}'
          print(f'✅ All {len(expected)} MCP tools registered')
          "

      - name: Check README exists
        run: ls README.md
