name: MCP Server CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate server syntax
        run: python3 -c "import ast; ast.parse(open('server.py').read()); print('✅ server.py syntax OK')"

      - name: Verify imports resolve
        run: |
          python3 -c "
          import httpx
          import fastmcp
          print('✅ All dependencies available')
          "

      - name: Check README exists
        run: |
          test -f README.md && echo '✅ README present'
